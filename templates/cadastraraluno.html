<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Professor</title>
    <link rel="stylesheet" href="..//static//css//cadastrarprofessor.css">
</head>
<body>

<div class="container">
    <h2>Cadastro de Aluno</h2>

    <form action="/aluno/cadastrar" method="post">

        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <label for="id_professor">Selecione seu Professor Orientador:</label><br>
        <select id="id_professor" name="id_professor" required>
            <option value="" disabled selected>Escolha um professor...</option>

            {% for prof in professores %}
                <option value="{{ prof.id }}">
                    {{ prof.nome }} (Projeto: {{ prof.nome_projeto }})
                </option>
            {% endfor %}
        </select>

        <button type="submit">Cadastrar</button>

    </form>
</div>

</body>
</html>
